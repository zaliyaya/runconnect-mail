name: Почта в Телеграм

on:
  schedule:
    - cron: "*/5 * * * *"  # каждые 5 минут (GitHub иногда запускает с задержкой)
    - cron: "17 4 1 * *"   # раз в месяц: коммит-keepalive, чтобы GitHub не отключил расписание
  workflow_dispatch:
    inputs:
      test:
        description: "Отправить в группу тестовое сообщение"
        type: boolean
        default: false

concurrency:
  group: mail
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Переслать новые письма
        env:
          IMAP_USER: info@runconnect.ru
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "-5133614656"
        run: |
          if [ -z "$IMAP_PASSWORD" ] || [ -z "$BOT_TOKEN" ]; then
            echo "Секреты IMAP_PASSWORD и BOT_TOKEN ещё не добавлены, пропускаю"
            exit 0
          fi
          python mail_to_telegram.py ${{ inputs.test && '--test' || '' }}

      - name: Сохранить номер последнего письма
        if: always()
        run: |
          git config user.name "mail-bot"
          git config user.email "mail-bot@users.noreply.github.com"
          if [ "${{ github.event.schedule }}" = "17 4 1 * *" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt  # активность, чтобы GitHub не выключил расписание
            git add keepalive.txt
          fi
          [ -f state.json ] && git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Обновлён state.json"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
